<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quantity Measurement</title>
  <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>
  <header class="topbar">
    <h1 class="title">Quantity Measurement Tool</h1>
  </header>

  <main class="main-content">
    <section class="card-section">
      <h2 class="section-title">Select Measurement Type</h2>
      <div class="card-grid">
        <div class="card">
          <img src="https://img.icons8.com/color/64/ruler.png" alt="Length"/>
          <p>Length</p>
        </div>
        <div class="card">
          <img src="https://img.icons8.com/color/64/scales.png" alt="Weight"/>
          <p>Weight</p>
        </div>
        <div class="card">
          <img src="https://img.icons8.com/color/64/thermometer.png" alt="Temperature"/>
          <p>Temperature</p>
        </div>
        <div class="card">
          <img src="https://img.icons8.com/color/64/measuring-cup.png" alt="Volume"/>
          <p>Volume</p>
        </div>
      </div>
    </section>

    <section class="card-section">
      <h2 class="section-title">Choose Action</h2>
      <div class="action-bar">
        <button class="tab-btn">Comparison</button>
        <button class="tab-btn">Conversion</button>
        <button class="tab-btn">Arithmetic</button>
      </div>
    </section>

    <section class="converter">
      <div class="converter-box">
        <label for="fromValue">From</label>
        <input type="number" id="fromValue" value="64"/>
        <select>
          <option>Kilometer</option>
          <option >Meter</option>
          <option>Centimeter</option>
          <option>Miles</option>
          <option>Feet</option>
        </select>
      </div>

      <div class="converter-box">
        <label for="toValue">To</label>
        <input type="number" id="toValue" value="64000"/>
        <select>
          <option>Meter</option>
          <option>Kilometer</option>
          <option>Centimeter</option>
          <option>Miles</option>
          <option>Feet</option>
        </select>
      </div>
    </section>
  </main>
  <script src="../javascript/script.js"></script>
</body>
</html>
