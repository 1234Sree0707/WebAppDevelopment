<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quantity Measurement</title>
  <link rel="stylesheet" href="../css/styles.css"/>
</head>

<body>

<header class="topbar">
  <h1 class="title">
    Quantity Measurement Tool
  </h1>
</header>

<main class="main-content">

<!-- ---------------- TYPE CARDS ---------------- -->

<section class="card-section">

  <h2 class="section-title">
    Select Measurement Type
  </h2>

  <div class="card-grid">

    <div class="card type-card" data-type="length">
      <img src="https://img.icons8.com/color/64/ruler.png" alt="Length"/>
      <p>Length</p>
    </div>

    <div class="card type-card" data-type="mass">
      <img src="https://img.icons8.com/color/64/scales.png" alt="Weight"/>
      <p>Weight</p>
    </div>

    <div class="card type-card" data-type="temperature">
      <img src="https://img.icons8.com/color/64/thermometer.png" alt="Temperature"/>
      <p>Temperature</p>
    </div>

    <div class="card type-card" data-type="volume">
      <img src="https://img.icons8.com/color/64/measuring-cup.png" alt="Volume"/>
      <p>Volume</p>
    </div>

  </div>

</section>

<!-- ---------------- ACTION TABS ---------------- -->

<section class="card-section">

  <h2 class="section-title">
    Choose Action
  </h2>

  <div class="action-bar">

  <button
      class="tab-btn action-btn"
      data-action="Comparison">
      Comparison
  </button>

  <button
      class="tab-btn action-btn active"
      data-action="Conversion">
      Conversion
  </button>

  <button
      class="tab-btn action-btn"
      data-action="Arithmetic">
      Arithmetic
  </button>

</div>

</section>

<!-- ---------------- OPERATOR ROW ---------------- -->

<section id="operator-selector" class="operator-bar">

  <button class="op-btn">+</button>
  <button class="op-btn">-</button>
  <button class="op-btn">*</button>
  <button class="op-btn">/</button>

</section>

<!-- ---------------- CONVERTER ---------------- -->

<section class="converter">

  <div class="converter-box">

    <label for="fromValue">
      From
    </label>

    <input
        type="number"
        id="fromValue"
        placeholder="Enter value"
    />

    <select></select>

  </div>

  <div class="converter-box">

    <label for="toValue">
      To
    </label>

    <input
        type="number"
        id="toValue"
        readonly
    />

    <select></select>

  </div>

</section>

<!-- ---------------- RESULT PANEL ---------------- -->

<section class="result-panel">

  <h2 class="section-title">
    Result
  </h2>

  <div class="result-display">

    <span id="result-value">
      —
    </span>

    <span id="result-unit"></span>

  </div>

</section>

<!-- ---------------- HISTORY PANEL ---------------- -->

<section class="history-panel">

  <h2 class="section-title">
    History
  </h2>

  <ul id="history-list">

    <li>
      No history yet.
    </li>

  </ul>

</section>

</main>

<script type="module" src="../javascript/script.js"></script>

</body>
</html>
